version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ip_score_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SALT_SECRET=${SALT_SECRET:-super-secret-salt-key-must-be-32-chars-minimum!}
      - ALLOW_PRIVATE_IPS_FOR_TESTING=${ALLOW_PRIVATE_IPS_FOR_TESTING:-false}
      - TZ=${TZ:-UTC}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

    # Security Hardening (Security by Design)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /app/logs:mode=1777,size=64M

    # Resource Allocation Limits (RAM and vCPUs)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/liveness')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    container_name: ip_score_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
